name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Backend Quality Gates
  backend-ci:
    name: Backend CI (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Go Tests
        run: go test -v -race ./...

  # 2. Frontend Quality Gates
  frontend-ci:
    name: Frontend CI (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Dart Analyze
        run: flutter analyze

      - name: Run Flutter Tests
        run: flutter test

  # 3. Build & Package Release APK
  build-release-apk:
    name: Build Release APK
    needs: [frontend-ci]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --target-platform=android-arm,android-arm64 --android-skip-build-dependency-validation --dart-define=API_BASE_URL=https://api-audionara.rhankbrguw.xyz

      - name: Prepare Industry Artifacts
        id: prepare_artifacts
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.0.0}"
          APK_NAME="AudioNara-${VERSION}.apk"
          (cp build/app/outputs/apk/release/app-release.apk "${APK_NAME}" 2>/dev/null || cp build/app/outputs/flutter-apk/app-release.apk "${APK_NAME}" 2>/dev/null)
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_artifacts.outputs.apk_name }}
          path: |
            frontend/AudioNara-*.apk
            frontend/AudioNara-*.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/AudioNara-*.apk
            frontend/AudioNara-*.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 4. Continuous Deployment (Backend Auto-Deploy to Azure VM)
  deploy-backend:
    name: Deploy Backend to Azure VM
    needs: [backend-ci, frontend-ci]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_SSH_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.AZURE_SSH_USER || secrets.SSH_USERNAME }}
          key: ${{ secrets.AZURE_SSH_KEY || secrets.SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "🚀 Starting Audionara deployment..."
            cd /opt/audionara
            if [ -d ".git" ]; then
              git pull origin main
            fi
            sudo docker compose up -d --build
            echo "🏥 Running health check..."
            sleep 5
            curl -f http://127.0.0.1:8080/health || (echo "Health check failed!" && exit 1)
            echo "✅ Deployment completed successfully!"
